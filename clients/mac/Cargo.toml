[package]
name = "renoa-mac"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: the server's build never compiles GPUI.
[workspace]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
gpui-kit = "0.9.0"
# GPUI strokes with lyon's options but does not re-export their caps and joins.
lyon_tessellation = "1.0.23"
# The Mac's timezone by name, to say when a routine runs on another clock.
iana-time-zone = "0.1.65"
md-5 = "0.10"
# Fetches the app's updates; already built for renoa-rcp-client.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
renoa-protocol = { path = "../../crates/renoa-protocol" }
renoa-rcp-client = { path = "../../crates/renoa-rcp-client" }
renoa-rcp-wire = { path = "../../crates/renoa-rcp-wire" }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

# Where the device's key and sign-in are kept: the login Keychain on macOS,
# the Secret Service keyring on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# renamex_np, to swap an update into the app's place in one step.
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1.0.1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["test-support"] }
tokio = { version = "1", features = ["io-util", "net"] }
futures-util = "0.3.33"
tokio-tungstenite = "0.29.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The text system the offscreen screens render with, off the main thread.
gpui-pre-apple = { version = "0.3.11", features = ["font-kit"] }

# As the root workspace: line tables for our code, none for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
