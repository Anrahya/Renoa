[package]
name = "renoa-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "renoa-node"
path = "src/bin/renoa-node/main.rs"

[dependencies]
base64.workspace = true
futures-util.workspace = true
renoa-agent = { path = "../renoa-agent", version = "0.1.0" }
renoa-discord = { path = "../renoa-discord", version = "0.1.0" }
renoa-kernel = { path = "../renoa-kernel", version = "0.1.0" }
renoa-local = { path = "../renoa-local", version = "0.1.0" }
renoa-protocol = { path = "../renoa-protocol", version = "0.1.0" }
renoa-rcp-client = { path = "../renoa-rcp-client", version = "0.1.0" }
renoa-rcp-wire = { path = "../renoa-rcp-wire", version = "0.1.0" }
renoa-telemetry = { path = "../renoa-telemetry", version = "0.1.0" }
ring.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
renoa-control = { path = "../renoa-control", version = "0.1.0" }
# Opens sealed notices with a stored key, which ring cannot hold.
aws-lc-rs.workspace = true
jiff.workspace = true
mnem.workspace = true
nix.workspace = true
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
