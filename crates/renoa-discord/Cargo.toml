[package]
name = "renoa-discord"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "renoa-discord"
path = "src/main.rs"
doc = false

[dependencies]
futures-util.workspace = true
renoa-agent = { path = "../renoa-agent", version = "0.1.0" }
renoa-control = { path = "../renoa-control", version = "0.1.0" }
renoa-kernel = { path = "../renoa-kernel", version = "0.1.0" }
renoa-local = { path = "../renoa-local", version = "0.1.0" }
renoa-protocol = { path = "../renoa-protocol", version = "0.1.0" }
renoa-rcp-client = { path = "../renoa-rcp-client", version = "0.1.0" }
renoa-telemetry = { path = "../renoa-telemetry", version = "0.1.0" }
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
renoa-agent-loop = { path = "../renoa-agent-loop", version = "0.1.0" }
tempfile.workspace = true

[lints]
workspace = true
