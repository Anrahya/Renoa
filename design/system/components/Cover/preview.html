<style>

.cover{position:relative;width:960px;height:300px;overflow:hidden;background:var(--background)}
.art{position:absolute;inset:0;width:960px;height:300px}
.sock{fill:none;stroke:var(--board-line);stroke-width:1.5}
.core{fill:var(--foreground)}
.model{fill:var(--part-model)}
.loop{fill:var(--part-loop)}
.tools{fill:var(--part-tools)}
.skills{fill:var(--part-skills)}
.text{position:absolute;left:48px;bottom:40px;max-width:440px}
.name{margin:0;font:600 120px/.92 var(--font-sans);font-stretch:86%;font-variation-settings:"wdth" 86;letter-spacing:-.04em;color:var(--foreground)}
.tag{margin:14px 0 0;font:400 14px/1.4 var(--font-sans);color:var(--muted-foreground)}
</style>
