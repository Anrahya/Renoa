<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans)} .wrap{padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}</style>
<div class="wrap" style="display:block">
  <div class="rn-tabs" role="tablist" aria-label="Agent A">
    <button class="rn-tab" role="tab" aria-selected="true">Overview</button>
    <button class="rn-tab" role="tab" aria-selected="false">Configure</button>
    <button class="rn-tab" role="tab" aria-selected="false">Automations <span class="rn-count">3</span></button>
    <button class="rn-tab" role="tab" aria-selected="false">Activity</button>
  </div>
</div>
<script>
document.querySelectorAll('.rn-tab').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.rn-tab').forEach(function(u){u.setAttribute('aria-selected',String(u===t))})})});
</script>
