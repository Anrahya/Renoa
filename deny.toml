# Dependency policy for Renoa's permissively licensed distribution.

[graph]
all-features = false

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = []
skip-tree = []

[[bans.skip]]
crate = "block-buffer@0.10.4"
reason = "Tungstenite's SHA-1 stack uses digest 0.10; Renoa's SHA-2 stack uses digest 0.11."

[[bans.skip]]
crate = "cpufeatures@0.2.17"
reason = "Tungstenite's SHA-1 stack uses digest 0.10; Renoa's SHA-2 stack uses digest 0.11."

[[bans.skip]]
crate = "crypto-common@0.1.7"
reason = "Tungstenite's SHA-1 stack uses digest 0.10; Renoa's SHA-2 stack uses digest 0.11."

[[bans.skip]]
crate = "digest@0.10.7"
reason = "Tungstenite's SHA-1 stack uses digest 0.10; Renoa's SHA-2 stack uses digest 0.11."

[[bans.skip]]
crate = "getrandom@0.3.4"
reason = "Rand through Tungstenite uses 0.3; UUID and tempfile use 0.4."

[[bans.skip]]
crate = "hashbrown@0.16.1"
reason = "sqlite-wasm-rs uses 0.16; hashlink and indexmap use 0.17."

[[bans.skip]]
crate = "r-efi@5.3.0"
reason = "The reviewed getrandom 0.3 branch uses r-efi 5; getrandom 0.4 uses r-efi 6."

[[bans.skip]]
crate = "syn@2.0.119"
reason = "Current proc macros use syn 2; serde, schemars, and ACP derive use syn 3."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
