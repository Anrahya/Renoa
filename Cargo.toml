[workspace]
members = ["crates/*"]
exclude = ["t3code/native/resource-monitor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.95"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.33"
getrandom = "0.4.3"
globset = { version = "0.4.20", default-features = false }
nix = { version = "0.30", features = ["process", "signal"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3.23"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29.0"
tokio-util = "0.7"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
