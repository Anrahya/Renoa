[package]
name = "renoa-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.95"

[dependencies]
nix = { version = "0.30", features = ["process", "signal"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", default-features = false, features = ["compression", "wry", "x11"] }
tauri-plugin-dialog = "2.7.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
